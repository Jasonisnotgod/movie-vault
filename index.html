<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光影档案 Movie Vault</title><style>body{margin:0;background:#10131a;color:#f3f4f6;font:16px/1.65 system-ui,-apple-system,sans-serif}header{padding:45px max(20px,calc((100% - 1150px)/2));background:linear-gradient(125deg,#18243c,#10131a)}h1{font-size:38px;margin:0}header p{color:#b8c0d0}main{max-width:1150px;margin:auto;padding:24px}input,select,button,textarea{background:#202735;color:white;border:1px solid #394355;border-radius:9px;padding:10px;font:inherit}input{min-width:220px;flex:1}button{cursor:pointer}button.active{background:#315f52;border-color:#6bbaa1}button:hover{border-color:#aaa}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.stats{display:flex;gap:20px;flex-wrap:wrap;color:#c6d0e2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:#1a202c;border:1px solid #303b4d;border-radius:16px;padding:19px}.card h2{font-size:20px;margin:0 0 5px}.meta{color:#aeb9ca;font-size:13px}.score{color:#f9c96b;font-weight:700}.desc{min-height:75px}.detail{color:#c8d2e1}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:12px;padding:7px}.note{width:100%;box-sizing:border-box;min-height:65px;margin-top:10px}.hide{display:none}.foot{color:#9aa5b8;font-size:13px;margin:30px 0}</style></head><body><header><h1>光影档案 <small>Movie Vault</small></h1><p>世界高分电影 · 私人观影记录 · 按 IMDb 参考评分排序</p><div class="stats" id="stats"></div></header><main><div class="tools"><input id="q" placeholder="搜索中英文片名、简介、国家"><select id="genre"><option value="">所有类型</option></select><select id="state"><option value="">所有状态</option><option value="watched">已看</option><option value="want">想看</option><option value="rewatch">想重温</option><option value="skip">暂不看</option><option value="none">未标记</option></select><button id="export">导出记录</button><label style="cursor:pointer;background:#202735;border-radius:9px;padding:10px">导入记录<input type="file" id="import" accept=".json" style="display:none"></label></div><div class="grid" id="grid"></div><p class="foot">当前为首批精选资料，尚非500部完整版。IMDb评分为参考值，并非实时接口数据。观影状态仅存于当前浏览器，请定期导出备份。无剧透介绍和推荐分析持续扩充。</p></main><script>const films=[["肖申克的救赎","The Shawshank Redemption",1994,9.3,"美国","剧情","被判终身监禁的银行家安迪在肖申克监狱中与瑞德建立友谊，并在长期压迫中保持自己的精神世界。","它不是简单的越狱故事，而是关于制度如何改变人、希望为何值得坚持。留意人物在漫长岁月中的细微变化。"],["教父","The Godfather",1972,9.2,"美国","犯罪","柯里昂家族的族长试图维护家族秩序，而年轻的迈克尔逐步卷入黑帮权力斗争。","以家族叙事剖析权力、忠诚与道德代价。摄影中的阴影和人物的沉默同样值得观察。"],["黑暗骑士","The Dark Knight",2008,9.1,"美国","犯罪","哥谭市的蝙蝠侠面对一个不断制造道德困境的对手小丑。","它将超级英雄电影提升为关于秩序、恐惧和公共伦理的讨论。"],["十二怒汉","12 Angry Men",1957,9,"美国","剧情","十二名陪审员在密闭房间里讨论一起谋杀案，一票不同意见改变了整个审议过程。","极适合学习证据推理、偏见识别和说服技巧，几乎只靠对白建立悬念。"],["辛德勒的名单","Schindler's List",1993,9,"美国","历史","二战中一名德国商人在纳粹统治下逐步决定帮助被迫害的犹太人。","从个人选择切入大屠杀历史，呈现道德觉醒的复杂过程。"],["教父2","The Godfather Part II",1974,9,"美国","犯罪","两条时间线交织展现维托的崛起和迈克尔掌权后的孤独。","与第一部对照观看，观察家族理想如何变成权力牢笼。"],["指环王3：王者归来","The Lord of the Rings: The Return of the King",2003,9,"新西兰","奇幻","护戒旅程进入终局，中土各方为生存而战。","史诗叙事与个人牺牲相结合，建议先看前两部。"],["指环王1：护戒使者","The Lord of the Rings: The Fellowship of the Ring",2001,8.9,"新西兰","奇幻","年轻霍比特人承担护送魔戒的危险使命。","观察托尔金世界的语言、种族、地理与神话设计。"],["低俗小说","Pulp Fiction",1994,8.8,"美国","犯罪","几组洛杉矶边缘人物的故事以打乱时间的方式相互交错。","观察叙事顺序如何改变人物形象与悬念。"],["阿甘正传","Forrest Gump",1994,8.8,"美国","剧情","阿甘的人生与美国数十年的社会事件交织。","既可看个人命运，也能借此认识美国社会文化。"],["盗梦空间","Inception",2010,8.8,"美国","科幻","一支团队进入梦境完成高度危险的意识任务。","多层时间结构与现实认知问题值得反复推敲。"],["搏击俱乐部","Fight Club",1999,8.8,"美国","剧情","失眠的白领与神秘男子建立地下搏击组织。","对消费主义、男性身份焦虑和极端化心理有尖锐批评。"],["指环王2：双塔奇兵","The Lord of the Rings: The Two Towers",2002,8.8,"新西兰","奇幻","护戒队伍分散后在战争阴影下继续各自使命。","群像叙事与战争场面突出，必须结合前后篇观看。"],["星际穿越","Interstellar",2014,8.7,"美国","科幻","地球生态危机下，宇航员穿越宇宙寻找人类未来。","可进一步学习相对论、黑洞和时间膨胀。"],["黑客帝国","The Matrix",1999,8.7,"美国","科幻","程序员尼奥开始怀疑日常世界的真实性。","连接哲学怀疑论、人工智能与自由意志。"],["好家伙","Goodfellas",1990,8.7,"美国","犯罪","一名年轻人进入黑帮，体验金钱、地位与背叛。","用流畅镜头和旁白呈现犯罪生活的吸引力及代价。"],["杰伊·比姆","Jai Bhim",2021,8.6,"印度","社会","一名律师协助边缘化群体寻找被警方拘押后失踪的亲人。","通过真实案件改编讨论种姓、司法与警察权力。"],["千与千寻","Spirited Away",2001,8.6,"日本","动画","女孩千寻误入神灵世界，必须工作并寻找救回父母的方法。","成长故事之下藏有对消费、劳动和身份的隐喻。"],["七宗罪","Se7en",1995,8.6,"美国","悬疑","两位警探调查以七宗罪为主题的连环案件。","压抑的视觉风格与伦理问题相互强化。"],["美丽人生","Life Is Beautiful",1997,8.6,"意大利","战争","一位父亲在战争迫害中竭力保护孩子的心灵。","喜剧与悲剧的交错让人重新理解亲情和尊严。"],["寄生虫","Parasite",2019,8.5,"韩国","剧情","贫困家庭以不同方式进入富裕家庭的生活。","空间设计和阶级隐喻非常值得细读。"],["爆裂鼓手","Whiplash",2014,8.5,"美国","音乐","一名年轻鼓手遇到追求极致表现的严厉导师。","讨论天赋、训练、羞辱与成就之间的边界。"],["三傻大闹宝莱坞","3 Idiots",2009,8.4,"印度","喜剧","三名工程学院学生面对考试压力、家庭期待和人生选择。","对教育功利主义的批评非常适合结合现实思考。"],["因果报应","Maharaja",2024,8.3,"印度","悬疑","理发师向警方报案，声称名叫拉克希米的东西被盗。","多线叙事与伏笔精密，建议不要提前看剧透。"],["地球上的星星","Taare Zameen Par",2007,8.3,"印度","教育","一名被认为成绩差的孩子遇到理解他的美术老师。","理解阅读障碍与个体差异，适合家长和教育工作者。"],["摔跤吧！爸爸","Dangal",2016,8.3,"印度","传记","父亲培养女儿成为优秀摔跤运动员。","兼具励志与关于性别、家庭期待的讨论。"],["调音师","Andhadhun",2018,8.2,"印度","悬疑","一位假装失明的钢琴师意外卷入命案。","叙事反转巧妙，适合观察观众如何被不可靠信息误导。"],["误杀瞒天记","Drishyam",2015,8.2,"印度","悬疑","一位父亲为了保护家人，与警方展开复杂的智力较量。","探讨家庭保护、记忆证据与道德界限；这里收录2015印地语版。"],["我的个神啊","PK",2014,8.1,"印度","喜剧","一个外星访客用天真问题挑战人类的宗教习俗。","以喜剧讨论信仰与宗教商业化。"],["小萝莉的猴神大叔","Bajrangi Bhaijaan",2015,8.1,"印度","剧情","印度男子帮助失散的巴基斯坦小女孩回家。","跨越国家与宗教对立的人性故事。"],["未知死亡","Ghajini",2008,7.4,"印度","动作","记忆受到严重损伤的男子依靠纹身和照片追查仇人。","记忆与复仇结合，情感冲击强。"]];let records={};try{records=JSON.parse(localStorage.getItem("movie-vault-records")||"{}")}catch{}const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const genres=[...new Set(films.map(x=>x[5]))].sort();$("genre").innerHTML+=[...genres].map(x=>'<option>'+esc(x)+'</option>').join("");function save(){localStorage.setItem("movie-vault-records",JSON.stringify(records))}function render(){let q=$("q").value.toLowerCase(),g=$("genre").value,s=$("state").value;let list=films.filter(f=>(!q||f.join(" ").toLowerCase().includes(q))&&(!g||f[5]===g)&&(!s||(s==="none"?!records[f[1]]?.status:records[f[1]]?.status===s)));$("stats").textContent='收录 '+films.length+' 部 · 已看 '+Object.values(records).filter(x=>x.status==="watched").length+' 部 · 想看 '+Object.values(records).filter(x=>x.status==="want").length+' 部';$("grid").innerHTML=list.map(f=>{let r=records[f[1]]||{};return '<article class="card"><h2>'+esc(f[0])+'</h2><div class="meta">'+esc(f[1])+' · '+f[2]+' · '+esc(f[4])+' · '+esc(f[5])+'</div><p class="score">★ IMDb '+f[3].toFixed(1)+'</p><p class="desc">'+esc(f[6])+'</p><details><summary>详细推荐理由</summary><p class="detail">'+esc(f[7])+'</p></details><div class="actions">'+[['watched','已看'],['want','想看'],['rewatch','想重温'],['skip','暂不看']].map(([v,l])=>'<button data-film="'+esc(f[1])+'" data-state="'+v+'" class="'+(r.status===v?'active':'')+'">'+l+'</button>').join('')+'</div><label class="meta">个人评分 <select data-rate="'+esc(f[1])+'"><option value="">未评分</option>'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'" '+(String(r.rating||'')===String(i+1)?'selected':'')+'>'+(i+1)+'/10</option>').join('')+'</select></label><textarea class="note" data-note="'+esc(f[1])+'" placeholder="观影笔记">'+esc(r.note||'')+'</textarea></article>'}).join("");}document.addEventListener('click',e=>{let b=e.target.closest('[data-state]');if(!b)return;let k=b.dataset.film;records[k]??={};records[k].status=records[k].status===b.dataset.state?'':b.dataset.state;save();render()});document.addEventListener('change',e=>{let k=e.target.dataset.rate;if(k){records[k]??={};records[k].rating=e.target.value;save()}});document.addEventListener('input',e=>{let k=e.target.dataset.note;if(k){records[k]??={};records[k].note=e.target.value;save()}});['q','genre','state'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$("export").onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='movie-vault-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("import").onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.records||typeof v.records!=='object')throw Error();records=v.records;save();render();alert('导入成功')}catch{alert('文件格式不正确')}};render();</script></body></html>
