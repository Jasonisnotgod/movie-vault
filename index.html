ont-weight:700}.content{padding:17px;flex:1;display:flex;flex-direction:column}h2{font-size:21px;line-height:1.35;margin:0}.en{font-size:13px;color:#a7b9ce}.meta{font-size:12px;color:#a7b9ce;margin:8px 0}.score{color:#f3ca6b;font-weight:700}.desc{color:#e0e7f0}.reason{color:#c6d3e1}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chips button{font-size:12px;padding:6px 8px}.chips .active{background:#235b4e;border-color:#53a98e}.expand{background:#26374a;border-color:#4b6481;margin-top:auto}.more{border-top:1px solid #344252;margin-top:12px;padding-top:12px}.more h3{font-size:14px;margin:12px 0 3px;color:#d6e7ff}.more p{margin:4px 0 10px}.note{width:100%;height:72px;margin-top:8px}.foot{color:#a9b7c9;font-size:13px;margin-top:28px}.tip{padding:14px;background:#1b2838;border-left:3px solid #769fc3;border-radius:8px;margin:0 0 18px;color:#cbd9e9}.toolbar label{cursor:pointer;background:#1b2533;border:1px solid #364153;padding:9px;border-radius:9px}@media(max-width:600px){header{padding-top:28px}.hero{height:155px}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>光影档案 <span style="font-size:.42em;color:#a8bfd6">MOVIE VAULT</span></h1><p>全球电影收藏 · 中英双语学习 · IMDb参考评分 · 私人观影日记</p><div id="stats" class="stats"></div></header><main><p class="tip">电影图片优先使用维基百科公开缩略图；无匹配图片时显示文字封面。每部详情提供IMDb电影与图片检索链接，避免未经授权直接嵌入IMDb图片。已加入更多逐片英文解读，部分条目仍待深度扩写。IMDb评分为历史参考值，非实时数据。本站没有剧透结局。</p><div class="toolbar"><input id="q" type="search" placeholder="搜索电影 / Search movies"><select id="genre"><option value="">全部类型 All genres</option></select><select id="state"><option value="">全部状态 All</option><option value="watched">已看 Watched</option><option value="want">想看 Watchlist</option><option value="rewatch">重温 Rewatch</option><option value="skip">暂不看 Skip</option><option value="none">未标记 Unmarked</option></select><select id="sort"><option value="score">IMDb评分 ↓</option><option value="year">上映年份 ↓</option><option value="title">片名 A-Z</option></select><button id="export">导出备份 Export</button><label>导入 Import<input id="import" type="file" accept=".json" hidden></label></div><section class="grid" id="grid"></section><p class="foot">注意：本页为持续更新的精选片库，不是IMDb官方Top 500榜单。观影状态保存在当前浏览器，换设备请导入备份。英文剧情及分析为学习用途的原创简述。</p></main><script>const films=[["肖申克的救赎","The Shawshank Redemption",1994,9.3,"美国","剧情","被判终身监禁的银行家安迪在肖申克监狱中与瑞德建立友谊，并在长期压迫中保持自己的精神世界。","它不是简单的越狱故事，而是关于制度如何改变人、希望为何值得坚持。留意人物在漫长岁月中的细微变化。"],["教父","The Godfather",1972,9.2,"美国","犯罪","柯里昂家族的族长试图维护家族秩序，而年轻的迈克尔逐步卷入黑帮权力斗争。","以家族叙事剖析权力、忠诚与道德代价。摄影中的阴影和人物的沉默同样值得观察。"],["黑暗骑士","The Dark Knight",2008,9.1,"美国","犯罪","哥谭市的蝙蝠侠面对一个不断制造道德困境的对手小丑。","它将超级英雄电影提升为关于秩序、恐惧和公共伦理的讨论。"],["十二怒汉","12 Angry Men",1957,9,"美国","剧情","十二名陪审员在密闭房间里讨论一起谋杀案，一票不同意见改变了整个审议过程。","极适合学习证据推理、偏见识别和说服技巧，几乎只靠对白建立悬念。"],["辛德勒的名单","Schindler's List",1993,9,"美国","历史","二战中一名德国商人在纳粹统治下逐步决定帮助被迫害的犹太人。","从个人选择切入大屠杀历史，呈现道德觉醒的复杂过程。"],["教父2","The Godfather Part II",1974,9,"美国","犯罪","两条时间线交织展现维托的崛起和迈克尔掌权后的孤独。","与第一部对照观看，观察家族理想如何变成权力牢笼。"],["指环王3：王者归来","The Lord of the Rings: The Return of the King",2003,9,"新西兰","奇幻","护戒旅程进入终局，中土各方为生存而战。","史诗叙事与个人牺牲相结合，建议先看前两部。"],["指环王1：护戒使者","The Lord of the Rings: The Fellowship of the Ring",2001,8.9,"新西兰","奇幻","年轻霍比特人承担护送魔戒的危险使命。","观察托尔金世界的语言、种族、地理与神话设计。"],["低俗小说","Pulp Fiction",1994,8.8,"美国","犯罪","几组洛杉矶边缘人物的故事以打乱时间的方式相互交错。","观察叙事顺序如何改变人物形象与悬念。"],["阿甘正传","Forrest Gump",1994,8.8,"美国","剧情","阿甘的人生与美国数十年的社会事件交织。","既可看个人命运，也能借此认识美国社会文化。"],["盗梦空间","Inception",2010,8.8,"美国","科幻","一支团队进入梦境完成高度危险的意识任务。","多层时间结构与现实认知问题值得反复推敲。"],["搏击俱乐部","Fight Club",1999,8.8,"美国","剧情","失眠的白领与神秘男子建立地下搏击组织。","对消费主义、男性身份焦虑和极端化心理有尖锐批评。"],["指环王2：双塔奇兵","The Lord of the Rings: The Two Towers",2002,8.8,"新西兰","奇幻","护戒队伍分散后在战争阴影下继续各自使命。","群像叙事与战争场面突出，必须结合前后篇观看。"],["黄金三镖客","The Good, the Bad and the Ugly",1966,8.8,"意大利","西部","三名枪手在美国内战背景下寻找埋藏的黄金。","镜头、配乐与悬念调度影响了后世动作电影。"],["星际穿越","Interstellar",2014,8.7,"美国","科幻","地球生态危机下，宇航员穿越宇宙寻找人类未来。","可进一步学习相对论、黑洞和时间膨胀。"],["黑客帝国","The Matrix",1999,8.7,"美国","科幻","程序员尼奥开始怀疑日常世界的真实性。","连接哲学怀疑论、人工智能与自由意志。"],["好家伙","Goodfellas",1990
