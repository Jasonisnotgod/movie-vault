ont-weight:700}.content{padding:17px;flex:1;display:flex;flex-direction:column}h2{font-size:21px;line-height:1.35;margin:0}.en{font-size:13px;color:#a7b9ce}.meta{font-size:12px;color:#a7b9ce;margin:8px 0}.score{color:#f3ca6b;font-weight:700}.desc{color:#e0e7f0}.reason{color:#c6d3e1}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chips button{font-size:12px;padding:6px 8px}.chips .active{background:#235b4e;border-color:#53a98e}.expand{background:#26374a;border-color:#4b6481;margin-top:auto}.more{border-top:1px solid #344252;margin-top:12px;padding-top:12px}.more h3{font-size:14px;margin:12px 0 3px;color:#d6e7ff}.more p{margin:4px 0 10px}.note{width:100%;height:72px;margin-top:8px}.foot{color:#a9b7c9;font-size:13px;margin-top:28px}.tip{padding:14px;background:#1b2838;border-left:3px solid #769fc3;border-radius:8px;margin:0 0 18px;color:#cbd9e9}.toolbar label{cursor:pointer;background:#1b2533;border:1px solid #364153;padding:9px;border-radius:9px}@media(max-width:600px){header{padding-top:28px}.hero{height:155px}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>光影档案 <span style="font-size:.42em;color:#a8bfd6">MOVIE VAULT</span></h1><p>全球电影收藏 · 中英双语学习 · IMDb参考评分 · 私人观影日记</p><div id="stats" class="stats"></div></header><main><p class="tip">电影图片优先使用维基百科公开缩略图；无匹配图片时显示电影专属文字封面，避免空白。已加入更多逐片英文解读，部分条目仍待深度扩写。IMDb评分为历史参考值，非实时数据。本站没有剧透结局。</p><div class="toolbar"><input id="q" type="search" placeholder="搜索电影 / Search movies"><select id="genre"><option value="">全部类型 All genres</option></select><select id="state"><option value="">全部状态 All</option><option value="watched">已看 Watched</option><option value="want">想看 Watchlist</option><option value="rewatch">重温 Rewatch</option><option value="skip">暂不看 Skip</option><option value="none">未标记 Unmarked</option></select><select id="sort"><option value="score">IMDb评分 ↓</option><option value="year">上映年份 ↓</option><option value="title">片名 A-Z</option></select><button id="export">导出备份 Export</button><label>导入 Import<input id="import" type="file" accept=".json" hidden></label></div><section class="grid" id="grid"></section><p class="foot">注意：本页为持续更新的精选片库，不是IMDb官方Top 500榜单。观影状态保存在当前浏览器，换设备请导入备份。英文剧情及分析为学习用途的原创简述。</p></main><script>const films=[["肖申克的救赎","The Shawshank Redemption",1994,9.3,"美国","剧情","被判终身监禁的银行家安迪在肖申克监狱中与瑞德建立友谊，并在长期压迫中保持自己的精神世界。","它不是简单的越狱故事，而是关于制度如何改变人、希望为何值得坚持。留意人物在漫长岁月中的细微变化。"],["教父","The Godfather",1972,9.2,"美国","犯罪","柯里昂家族的族长试图维护家族秩序，而年轻的迈克尔逐步卷入黑帮权力斗争。","以家族叙事剖析权力、忠诚与道德代价。摄影中的阴影和人物的沉默同样值得观察。"],["黑暗骑士","The Dark Knight",2008,9.1,"美国","犯罪","哥谭市的蝙蝠侠面对一个不断制造道德困境的对手小丑。","它将超级英雄电影提升为关于秩序、恐惧和公共伦理的讨论。"],["十二怒汉","12 Angry Men",1957,9,"美国","剧情","十二名陪审员在密闭房间里讨论一起谋杀案，一票不同意见改变了整个审议过程。","极适合学习证据推理、偏见识别和说服技巧，几乎只靠对白建立悬念。"],["辛德勒的名单","Schindler's List",1993,9,"美国","历史","二战中一名德国商人在纳粹统治下逐步决定帮助被迫害的犹太人。","从个人选择切入大屠杀历史，呈现道德觉醒的复杂过程。"],["教父2","The Godfather Part II",1974,9,"美国","犯罪","两条时间线交织展现维托的崛起和迈克尔掌权后的孤独。","与第一部对照观看，观察家族理想如何变成权力牢笼。"],["指环王3：王者归来","The Lord of the Rings: The Return of the King",2003,9,"新西兰","奇幻","护戒旅程进入终局，中土各方为生存而战。","史诗叙事与个人牺牲相结合，建议先看前两部。"],["指环王1：护戒使者","The Lord of the Rings: The Fellowship of the Ring",2001,8.9,"新西兰","奇幻","年轻霍比特人承担护送魔戒的危险使命。","观察托尔金世界的语言、种族、地理与神话设计。"],["低俗小说","Pulp Fiction",1994,8.8,"美国","犯罪","几组洛杉矶边缘人物的故事以打乱时间的方式相互交错。","观察叙事顺序如何改变人物形象与悬念。"],["阿甘正传","Forrest Gump",1994,8.8,"美国","剧情","阿甘的人生与美国数十年的社会事件交织。","既可看个人命运，也能借此认识美国社会文化。"],["盗梦空间","Inception",2010,8.8,"美国","科幻","一支团队进入梦境完成高度危险的意识任务。","多层时间结构与现实认知问题值得反复推敲。"],["搏击俱乐部","Fight Club",1999,8.8,"美国","剧情","失眠的白领与神秘男子建立地下搏击组织。","对消费主义、男性身份焦虑和极端化心理有尖锐批评。"],["指环王2：双塔奇兵","The Lord of the Rings: The Two Towers",2002,8.8,"新西兰","奇幻","护戒队伍分散后在战争阴影下继续各自使命。","群像叙事与战争场面突出，必须结合前后篇观看。"],["黄金三镖客","The Good, the Bad and the Ugly",1966,8.8,"意大利","西部","三名枪手在美国内战背景下寻找埋藏的黄金。","镜头、配乐与悬念调度影响了后世动作电影。"],["星际穿越","Interstellar",2014,8.7,"美国","科幻","地球生态危机下，宇航员穿越宇宙寻找人类未来。","可进一步学习相对论、黑洞和时间膨胀。"],["黑客帝国","The Matrix",1999,8.7,"美国","科幻","程序员尼奥开始怀疑日常世界的真实性。","连接哲学怀疑论、人工智能与自由意志。"],["好家伙","Goodfellas",1990,8.7,"美国","犯罪","一名年轻人进入黑帮，体验 erm memory uses tattoos and photographs to pursue revenge.","The thriller asks how identity and purpose survive when new memories cannot be retained.","amnesia 失忆 · revenge 复仇 · photograph 照片"],"Malèna":["A boy observes a beautiful woman whose life is shaped by gossip and hostility in a wartime town.","The story exposes how collective judgment and objectification can harm an isolated person.","gossip 流言 · objectification 物化 · prejudice 偏见"],"Let the Bullets Fly":["A bandit posing as a county governor clashes with a powerful local figure.","Its fast dialogue and satire reward attention to political symbolism and shifting alliances.","satire 讽刺 · power struggle 权力斗争 · disguise 伪装"]};let records={};try{records=JSON.parse(localStorage.getItem("movie-vault-records")||"{}")}catch{}const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let openSet=new Set();let posterCache={};try{posterCache=JSON.parse(localStorage.getItem("movie-vault-posters")||"{}")}catch{}const genres=[...new Set(films.map(f=>f[5]))].sort();$("genre").innerHTML+=genres.map(g=>'<option>'+esc(g)+'</option>').join("");function save(){localStorage.setItem("movie-vault-records",JSON.stringify(records))}function details(f){let o=overrides[f[1]]||[];let english=o[0]||('Set against the world of '+f[5].toLowerCase()+', this '+f[2]+' film explores the choices and relationships of its central characters. Read the Chinese synopsis above for the specific plot.');let reason=o[1]||('Consider how the director uses character decisions, dialogue and visual storytelling to develop the themes highlighted in the Chinese recommendation above.');let words=o[2]||'character 人物 · conflict 冲突 · theme 主题 · storytelling 叙事';return '<div class="more"><h3>故事简介 · Story / 剧情</h3><p>'+esc(f[6])+'</p><p lang="en">'+esc(english)+'</p><h3>推荐理由 · Why watch / 为什么值得看</h3><p>'+esc(f[7])+'</p><p lang="en">'+esc(reason)+'</p><h3>英语词汇 · English vocabulary</h3><p>'+esc(words)+'</p><h3>观影思考 · Reflection</h3><p>人物面临的核心选择是什么？电影通过哪些场景表达主题？如果你处在主人公的位置，会如何决定？</p><p lang="en">What is the central dilemma? Which scenes express the main theme? What would you do in the same situation?</p><h3>个人评分 · My rating</h3><select data-rate="'+esc(f[1])+'"><option value="">未评分</option>'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'" '+(String(records[f[1]]?.rating||"")===String(i+1)?"selected":"")+'>'+(i+1)+'/10</option>').join("")+'</select><h3>观影笔记 · My notes</h3><textarea class="note" data-note="'+esc(f[1])+'" placeholder="写下自己的感想 / Your thoughts">'+esc(records[f[1]]?.note||"")+'</textarea><p><a target="_blank" rel="noopener noreferrer" style="color:#a9c9ff" href="https://www.imdb.com/find/?q='+encodeURIComponent(f[1]+' '+f[2])+'">在IMDb查找 / Find on IMDb ↗</a></p></div>'}function render(){let q=$("q").value.toLowerCase(),g=$("genre").value,s=$("state").value;let list=films.filter(f=>(!q||f.join(" ").toLowerCase().includes(q))&&(!g||f[5]===g)&&(!s||(s==="none"?!records[f[1]]?.status:records[f[1]]?.status===s)));let mode=$("sort").value;list.sort((a,b)=>mode==="year"?b[2]-a[2]:mode==="title"?a[1].localeCompare(b[1]):b[3]-a[3]);$("stats").innerHTML=[['收录 Films',films.length],['已看 Watched',Object.values(records).filter(x=>x.status==="watched").length],['想看 Watchlist',Object.values(records).filter(x=>x.status==="want").length]].map(x=>'<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join("");$("grid").innerHTML=list.map((f,i)=>{let r=records[f[1]]||{},key=encodeURIComponent(f[1]),img=posterCache[f[1]];return '<article class="card"><div class="hero" data-poster="'+esc(f[1])+'">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="'+esc(f[0])+' 海报">':'<span class="placeholder">'+esc(f[0])+'<small>'+esc(f[1])+' · '+f[2]+'</small></span>')+'<span class="rank">#'+(i+1)+'</span></div><div class="content"><h2>'+esc(f[0])+'</h2><div class="en">'+esc(f[1])+'</div><div class="meta">'+f[2]+' · '+esc(f[4])+' · '+esc(f[5])+'　<span class="score">★ '+f[3].toFixed(1)+'</span></div><p class="desc">'+esc(f[6])+'</p><p class="reason"><strong>为什么值得看：</strong>'+esc(f[7])+'</p><div class="chips">'+[['watched','已看'],['want','想看'],['rewatch','重温'],['skip','暂不看']].map(([v,l])=>'<button data-film="'+esc(f[1])+'" data-state="'+v+'" class="'+(r.status===v?'active':'')+'">'+l+'</button>').join('')+'</div><button class="expand" data-open="'+esc(f[1])+'">'+(openSet.has(f[1])?'收起 Close':'展开中英双语解读 · Read more')+'</button>'+(openSet.has(f[1])?details(f):'')+'</div></article>'}).join("");loadPosters()}let posterObserver;function loadPosters(){if(!('IntersectionObserver' in window))return;if(posterObserver)posterObserver.disconnect();posterObserver=new IntersectionObserver(entries=>{for(let e of entries){if(!e.isIntersecting)continue;posterObserver.unobserve(e.target);let name=e.target.dataset.poster;if(posterCache[name]!==undefined)continue;let f=films.find(x=>x[1]===name);if(!f)continue;let title=f[1].replace(/ /g,'_');fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('intitle:'+f[1]+' '+f[2]+' film')+'&gsrlimit=1&prop=pageimages&pithumbsize=500&format=json&origin=*').then(r=>r.json()).then(d=>{let pages=Object.values(d.query?.pages||{});let page=pages.find(p=>p.title&&p.title.toLowerCase().includes(f[1].toLowerCase()))||pages[0];let url=page?.title?.toLowerCase().includes(f[1].toLowerCase())?page?.thumbnail?.source||'':'';posterCache[name]=url;try{localStorage.setItem('movie-vault-posters',JSON.stringify(posterCache))}catch{}if(url){document.querySelectorAll('[data-poster]').forEach(el=>{if(el.dataset.poster===name)el.innerHTML='<img loading="lazy" src="'+esc(url)+'" alt="'+esc(f[0])+' 图片">'+el.querySelector('.rank').outerHTML})}}).catch(()=>{posterCache[name]=''})}}, {rootMargin:'300px'});document.querySelectorAll('[data-poster]').forEach(el=>posterObserver.observe(el))}document.addEventListener('click',e=>{let b=e.target.closest('[data-state]');if(b){let k=b.dataset.film;records[k]??={};records[k].status=records[k].status===b.dataset.state?'':b.dataset.state;save();render()}let o=e.target.closest('[data-open]');if(o){let k=o.dataset.open;openSet.has(k)?openSet.delete(k):openSet.add(k);render()}});document.addEventListener('change',e=>{let k=e.target.dataset.rate;if(k){records[k]??={};records[k].rating=e.target.value;save()}});document.addEventListener('input',e=>{let k=e.target.dataset.note;if(k){records[k]??={};records[k].note=e.target.value;save()}});['q','genre','state','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$("export").onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify({version:2,records},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='movie-vault-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("import").onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.records||typeof v.records!=='object')throw Error();records=v.records;save();render();alert('导入成功 / Imported')}catch{alert('文件格式不正确 / Invalid file')}};render();</script></body></html>
